<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PcDrop - Rastreador de Precios PCComponentes</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <header class="header">
        <nav class="nav-container">
            <a href="/" class="logo">
                <i class="fas fa-chart-line"></i>
                <span>PcDrop</span>
            </a>

            <div class="search-bar">
                <input 
                    type="text" 
                    id="urlInput" 
                    class="search-input" 
                    placeholder="Pega una URL de PCComponentes para rastrear..."
                >
                <button id="addBtn" class="search-btn">
                    <i class="fas fa-plus"></i>
                    <span>Rastrear</span>
                </button>
            </div>

            <div class="nav-menu">
                <a href="chollos.html" class="nav-link">
                    <i class="fas fa-fire"></i> Chollos
                </a>
                <a href="productos.html" class="nav-link">
                    <i class="fas fa-boxes"></i> Todos
                </a>
            </div>
        </nav>
    </header>

    <main class="main-content">
        
        <section id="chollos" class="section">
            <div class="section-header">
                <div style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
                    <div>
                        <h2 class="section-title">
                            <i class="fas fa-fire"></i>
                            Mejores Ofertas
                        </h2>
                        <p class="section-subtitle">Los productos con mayores descuentos</p>
                    </div>
                    <a href="chollos.html" class="btn btn-secondary">
                        Ver todas
                        <i class="fas fa-arrow-right"></i>
                    </a>
                </div>
            </div>
            
            <div id="chollosGrid" class="products-grid">
                <div class="loading">
                    <i class="fas fa-spinner fa-spin"></i>
                    <span>Cargando mejores ofertas...</span>
                </div>
            </div>
        </section>

        <section id="todos" class="section">
            <div class="section-header">
                <div style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
                    <div>
                        <h2 class="section-title">
                            <i class="fas fa-boxes"></i>
                            Todos los Productos
                        </h2>
                        <p class="section-subtitle">Productos rastreados recientemente</p>
                    </div>
                    <a href="productos.html" class="btn btn-secondary">
                        Ver todos
                        <i class="fas fa-arrow-right"></i>
                    </a>
                </div>
            </div>
            
            <div id="todosGrid" class="products-grid">
                <div class="loading">
                    <i class="fas fa-spinner fa-spin"></i>
                    <span>Cargando productos...</span>
                </div>
            </div>
        </section>

    </main>

    <div class="toast-container" id="toastContainer"></div>

    <script src="app.js"></script>
</body>
</html>
