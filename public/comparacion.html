<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comparación con Fuentes Externas - PcDrop</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="comparacion.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <header class="header">
        <nav class="nav-container">
            <a href="/" class="logo">
                <i class="fas fa-chart-line"></i>
                <span>PcDrop</span>
            </a>
            <button onclick="window.history.back()" class="btn btn-secondary" style="width: auto; min-width: auto; max-width: 150px; padding: 0.6rem 1.2rem; white-space: nowrap; flex-shrink: 0;">
                <i class="fas fa-arrow-left"></i> Volver
            </button>
        </nav>
    </header>

    <div class="comparison-container">
        <div class="comparison-header">
            <h1><i class="fas fa-balance-scale"></i> Comparación con Fuentes Externas</h1>
            <p>Valida la precisión de nuestro rastreador comparando con múltiples fuentes de precios</p>
        </div>

        <div id="loadingContainer" class="loading-container">
            <i class="fas fa-spinner loading-spinner"></i>
            <div class="loading-text">Analizando precios...</div>
            <div class="loading-steps">
                <div class="loading-step active" id="step1">
                    <i class="fas fa-database"></i> Obteniendo datos internos...
                </div>
                <div class="loading-step" id="step2">
                    <i class="fas fa-shopping-bag"></i> Consultando Google Shopping...
                </div>
                <div class="loading-step" id="step3">
                    <i class="fas fa-chart-line"></i> Consultando CamelCamelCamel...
                </div>
                <div class="loading-step" id="step4">
                    <i class="fas fa-check-circle"></i> Finalizando...
                </div>
            </div>
        </div>

        <div id="resultsContainer" style="display: none;">
            
        </div>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script src="comparacion.js"></script>
</body>
</html>
